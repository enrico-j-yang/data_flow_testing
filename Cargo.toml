[package]
name = "data-flow-analyzer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
globset = "0.4.18"
hex = "0.4.3"
html-escape = "0.2.13"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
shlex = "1.3.0"
thiserror = "2.0.18"
toml = "1.1.2"
tree-sitter = "0.26.9"
tree-sitter-c = "0.24.1"
tree-sitter-python = "0.25.0"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
